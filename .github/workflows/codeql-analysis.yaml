name: codeql-analysis

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
  schedule:
    - cron: '15 0 * * 5'

# Disable all permissions by defaults:
# Permissions are enabled on a per-job basis.
permissions: { }

concurrency:
  # One group per PR, or per ref for branch pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel in-progress runs for PRs only, so release branch builds always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  analyze:
    uses: apache/logging-parent/.github/workflows/codeql-analysis-reusable.yaml@gha/v0
    with:
      java-version: 17
    permissions:
      actions: read
      contents: read
      security-events: write
